# tic-campus on the ORT VM (tic-platform/PLAN.md §3, M14).
#
# `tic-campus-edge` is created by tic-hosting from `[origins.tic-campus]` via
# `tic apply-config`; compose never creates or deletes it. `tic-db` is
# /opt/tic-platform's, `internal: true` — no gateway, no published port. Names
# are pinned (DEPLOY-CONVENTIONS.md, "Renaming a compose network").
#
# There is no `depends_on` for the database: it is another stack's container, so
# compose cannot express the dependency. The Makefile checks it before rolling.
name: tic-campus

services:
  api:
    build: { context: ., dockerfile: docker/api/Dockerfile }
    container_name: tic-campus-api
    restart: unless-stopped
    expose: ["3000"]
    # Compose reads `.env` on the HOST at parse time and fails if it is absent,
    # so `make config` needs it too. It is not the `/etc/<stack>.env` shape
    # tic-hosting uses: there is nothing to `source` (DEPLOY-CONVENTIONS.md §4).
    env_file: [.env]
    # `campus_svc`'s password, mounted as a file rather than passed as an
    # environment variable, so it never appears in `docker inspect`.
    # `DATABASE_PASSWORD_FILE` in `.env` must name this exact target — rename
    # one side only and the container refuses to boot with ENOENT.
    secrets:
      - source: db_svc_password
        target: /run/secrets/db_svc_password
      - source: tic_auth_client_secret
        target: /run/secrets/tic_auth_client_secret
    # The bytes of every upload (F9). `web` does not get it: nginx proxies
    # /api/ to the api, which is what serves them. `UPLOADS_DIR` in `.env` must
    # name this exact target — rename one side only and the files are still on
    # the volume, but every article that pointed at one is broken.
    volumes:
      - uploads:/var/lib/tic-campus/uploads
    # `tic-db` for the database; the edge network is how tic-proxy reaches the
    # stack. `web` stays off `tic-db`: nginx has no business there.
    networks: [tic-campus-edge, tic-db]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  web:
    build: { context: ., dockerfile: docker/web/Dockerfile }
    container_name: tic-campus-web
    restart: unless-stopped
    expose: ["80"]
    networks: [tic-campus-edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

networks:
  tic-campus-edge:
    external: true
  tic-db:
    external: true

# `external: true`, hand-created, exactly like tic-platform's `tic-db-data`:
# these are teachers' files and the only copy of them outside the nightly
# backup, so `docker compose down -v` must not be able to take them. Compose
# refuses to start without it, which is the loud failure a silently-created
# empty anonymous volume would not be.
#
#   docker volume create tic-campus-uploads
#
# `make rollout` checks for it before building.
volumes:
  uploads:
    external: true
    name: tic-campus-uploads

# `secrets/db_owner_password` is deliberately NOT here: migrations run on the
# host as `campus_owner` and that file never enters a container, so mounting it
# would widen its reach for nothing.
#
# **Both of these are `root:root 0600`, and that is a property of the Dockerfile
# rather than of the secrets.** Outside swarm a compose secret is a bind mount
# with ownership preserved (`uid`/`gid`/`mode` here are swarm-only and silently
# ignored), so the owner has to be whichever uid actually opens the file —
# `docker/api/Dockerfile` sets no `USER`, so that is root. Adding one means
# chowning these in the same commit, or this stack meets tic-auth's 2026-09-03
# outage from the other direction (DEPLOY-CONVENTIONS.md §4).
secrets:
  db_svc_password:
    file: ./secrets/db_svc_password
  tic_auth_client_secret:
    file: ./secrets/tic_auth_client_secret
