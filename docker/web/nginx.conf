# One origin: the frontend at /, the api under /api/ (same-origin, no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the upstream per request, so web still boots while api is down
    # (a literal proxy_pass host fails nginx at startup — measured in MEV).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $campus_api http://tic-campus-api:3000;

    location /api/ {
        # F9's uploads, and the reason this is not the default 1m: nginx
        # answers a bigger body with its own HTML 413 before the request
        # reaches the api at all, so the client never sees the error envelope
        # it branches on. The api's own limits are independent and smaller —
        # 20 MB on multer, 1 MB on express.json.
        client_max_body_size 20m;

        proxy_pass $campus_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
